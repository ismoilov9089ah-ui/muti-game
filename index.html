<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приключения Мути</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #87CEEB; overflow: hidden; font-family: Arial, sans-serif; }
        #gameArea { position: relative; width: 100vw; height: 100vh; background: linear-gradient(#87CEEB, #e0f6ff); }
        #ground { position: absolute; bottom: 0; width: 100%; height: 20%; background-color: #4CAF50; border-top: 5px solid #388E3C; }
        #muti { position: absolute; bottom: 20%; left: 50px; width: 50px; height: 70px; background-color: #8B4513; border-radius: 10px; transition: bottom 0.3s; text-align: center; line-height: 70px; color: white; font-weight: bold; }
        #crystal { position: absolute; bottom: 20%; right: -50px; width: 30px; height: 40px; background-color: #00FFFF; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
        #scoreBoard { position: absolute; top: 20px; left: 20px; font-size: 24px; font-weight: bold; color: #333; }
        #tapText { position: absolute; top: 50%; width: 100%; text-align: center; font-size: 20px; color: #555; opacity: 0.7; }
    </style>
</head>
<body>

<div id="gameArea" onclick="jump()">
    <div id="scoreBoard">Кристаллы: <span id="score">0</span></div>
    <div id="tapText">Нажми на экран, чтобы прыгнуть!</div>
    <div id="muti">Мути</div>
    <div id="crystal"></div>
    <div id="ground"></div>
</div>

<script>
    // Подключаем Telegram Web App API
    let tg = window.Telegram.WebApp;
    tg.expand(); // Открываем игру на весь экран в Телеграме

    let muti = document.getElementById("muti");
    let crystal = document.getElementById("crystal");
    let scoreDisplay = document.getElementById("score");
    
    let isJumping = false;
    let score = 0;
    let crystalPosition = window.innerWidth;

    // Функция прыжка
    function jump() {
        if (isJumping) return;
        isJumping = true;
        muti.style.bottom = "40%"; // Мути прыгает
        
        setTimeout(() => {
            muti.style.bottom = "20%"; // Мути приземляется
            isJumping = false;
        }, 500);
    }

    // Движение кристалла и подсчет очков
    setInterval(() => {
        crystalPosition -= 10;
        crystal.style.left = crystalPosition + "px";

        // Если кристалл прошел за экран, возвращаем его
        if (crystalPosition < -30) {
            crystalPosition = window.innerWidth;
        }

        // Проверка столкновения (Мути поймала кристалл)
        let mutiRect = muti.getBoundingClientRect();
        let crystalRect = crystal.getBoundingClientRect();

        if (
            mutiRect.right > crystalRect.left &&
            mutiRect.left < crystalRect.right &&
            mutiRect.bottom > crystalRect.top &&
            mutiRect.top < crystalRect.bottom
        ) {
            score++;
            scoreDisplay.innerText = score;
            crystalPosition = window.innerWidth; // Прячем кристалл после сбора
            tg.HapticFeedback.impactOccurred('light'); // Вибрация на телефоне в Telegram
        }
    }, 30);
</script>

</body>
</html>
