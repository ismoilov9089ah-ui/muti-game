<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Отключаем приближение, чтобы игра не дергалась на телефоне -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приключения Мути</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; /* Убираем прокрутку */
            background-color: #1e272e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Запрещаем жесты браузера */
        }
        canvas {
            display: block;
        }
        /* Красивый интерфейс поверх игры */
        #ui {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
            color: white; font-size: 22px; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #hearts { color: #ff4757; font-size: 26px; letter-spacing: 2px; }
        #score { display: flex; align-items: center; gap: 8px; color: #ffd32a; }
        #tap-text {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8); font-size: 24px; font-weight: bold;
            text-shadow: 1px 1px 5px black; pointer-events: none; text-align: center;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); } }
    </style>
</head>
<body>

    <div id="ui">
        <div id="hearts">❤️❤️❤️❤️🖤</div>
        <div id="score">💎 <span id="scoreValue">0</span></div>
    </div>
    <div id="tap-text">Нажми, чтобы прыгнуть!</div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('scoreValue');
        const tapText = document.getElementById('tap-text');

        // Подстраиваем размер под экран телефона
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Загрузка картинок (если их нет на GitHub, игра использует цвета)
        const images = {
            bg: new Image(),
            player: new Image(),
            crystal: new Image()
        };
        images.bg.src = 'bg.jpg';         // Ожидаем картинку фона
        images.player.src = 'muti.png';   // Ожидаем картинку персонажа
        images.crystal.src = 'crystal.png';// Ожидаем картинку кристалла

        // Настройки игры
        let score = 0;
        let isGameStarted = false;

        const player = {
            x: 50, y: 0, width: 60, height: 80,
            dy: 0, gravity: 0.6, jumpPower: -12, isGrounded: false
        };

        const crystal = {
            x: canvas.width, y: 0, width: 40, height: 40, speed: 5
        };

        // Логика прыжка
        function jump() {
            if (!isGameStarted) {
                isGameStarted = true;
                tapText.style.display = 'none'; // Прячем текст после первого прыжка
            }
            if (player.isGrounded) {
                player.dy = player.jumpPower;
                player.isGrounded = false;
            }
        }

        // Слушаем нажатия по экрану (для телефона и мышки)
        window.addEventListener('touchstart', jump);
        window.addEventListener('mousedown', jump);

        // Главный цикл игры
        function update() {
            const groundY = canvas.height - 100;

            // Физика персонажа
            player.dy += player.gravity;
            player.y += player.dy;

            if (player.y + player.height >= groundY) {
                player.y = groundY - player.height;
                player.dy = 0;
                player.isGrounded = true;
            }

            // Движение кристалла
            if (isGameStarted) {
                crystal.x -= crystal.speed;
                crystal.y = groundY - 60; // Высота кристалла

                // Столкновение с кристаллом
                if (player.x < crystal.x + crystal.width &&
                    player.x + player.width > crystal.x &&
                    player.y < crystal.y + crystal.height &&
                    player.y + player.height > crystal.y) {
                    score++;
                    scoreElement.innerText = score;
                    crystal.x = canvas.width + Math.random() * 300; // Появляется снова
                    crystal.speed += 0.2; // Постепенно ускоряем игру
                }

                // Если кристалл улетел за экран
                if (crystal.x + crystal.width < 0) {
                    crystal.x = canvas.width + Math.random() * 300;
                }
            }
        }

        function draw() {
            const groundY = canvas.height - 100;

            // 1. Отрисовка фона
            if (images.bg.complete && images.bg.naturalWidth > 0) {
                ctx.drawImage(images.bg, 0, 0, canvas.width, canvas.height);
            } else {
                // Красивый градиент, если картинки фона еще нет
                let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                grad.addColorStop(0, '#74b9ff');
                grad.addColorStop(1, '#0984e3');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 2. Отрисовка земли
            ctx.fillStyle = '#00b894';
            ctx.fillRect(0, groundY, canvas.width, 100);
            ctx.fillStyle = '#009432';
            ctx.fillRect(0, groundY, canvas.width, 10);

            // 3. Отрисовка кристалла
            if (images.crystal.complete && images.crystal.naturalWidth > 0) {
                ctx.drawImage(images.crystal, crystal.x, crystal.y, crystal.width, crystal.height);
            } else {
                // Если нет картинки, рисуем красивый ромбик
                ctx.fillStyle = '#00d2d3';
                ctx.beginPath();
                ctx.moveTo(crystal.x + crystal.width/2, crystal.y);
                ctx.lineTo(crystal.x + crystal.width, crystal.y + crystal.height/2);
                ctx.lineTo(crystal.x + crystal.width/2, crystal.y + crystal.height);
                ctx.lineTo(crystal.x, crystal.y + crystal.height/2);
                ctx.fill();
            }

            // 4. Отрисовка персонажа
            if (images.player.complete && images.player.naturalWidth > 0) {
                ctx.drawImage(images.player, player.x, player.y, player.width, player.height);
            } else {
                // Если картинки Мути еще нет, рисуем красивую капсулу
                ctx.fillStyle = '#e84393';
                ctx.beginPath();
                ctx.roundRect(player.x, player.y, player.width, player.height, 20);
                ctx.fill();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Запуск
        loop();
    </script>
</body>
</html>
